<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宴席排菜单</title>
<script src="html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css">
<style>
:root{
  --bg:#f2f3f5;--card:#fff;--line:#e4e6eb;--text:#25272b;--sub:#8a8f99;
  --brand:#8c1c1c;--brand2:#c0392b;--radius:10px;
  --ui-font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--ui-font);background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.4}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;
  padding:8px 14px;background:linear-gradient(135deg,#7c1616,#a52a2a);color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.15);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:1px}
.tabs{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;align-items:center}
.tabs button{background:rgba(255,255,255,.15);border:0;color:#fff;padding:6px 12px;
  border-radius:999px;cursor:pointer;font-size:12.5px;font-family:inherit}
.tabs button:hover{background:rgba(255,255,255,.28)}
.tabs button.active{background:#fff;color:var(--brand);font-weight:600}
#btnCheckUpdate{background:rgba(255,255,255,.18);border:0;color:#fff;
  font-size:15px;cursor:pointer;padding:5px 9px;border-radius:999px;
  transition:.2s;margin-left:4px}
#btnCheckUpdate:hover{background:rgba(255,255,255,.3)}
#btnCheckUpdate.hasNew{background:#ffd76a;color:#8a6d00}
#btnExit{background:transparent;border:0;color:rgba(255,255,255,.7);
  font-size:12.5px;cursor:pointer;padding:6px 10px;border-radius:999px}
#btnExit:hover{background:rgba(255,255,255,.15);color:#fff}
.save-hint{font-size:11.5px;color:rgba(255,255,255,.85);padding:3px 9px;
  border-radius:999px;background:rgba(0,0,0,.15);transition:.3s}
.save-hint.flash{background:#4caf50;color:#fff}
main{padding:10px;max-width:1500px;margin:0 auto}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border-radius:var(--radius);padding:10px 13px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:9px}
.card h3{margin:0 0 7px;font-size:12.5px;color:var(--brand);font-weight:700}
label.fld{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:4px;font-size:12.5px;color:#555;min-height:26px}
label.fld:last-child{margin-bottom:0}
label.fld input,label.fld select{padding:4px 8px;border:1px solid var(--line);
  border-radius:6px;font-size:12.5px;font-family:inherit;color:var(--text);
  background:#fafbfc;flex:1;max-width:170px;min-width:0;height:26px}
label.fld input:focus,label.fld select:focus{
  outline:2px solid rgba(140,28,28,.18);border-color:var(--brand2)}
input[type=color]{width:40px;height:26px;padding:1px;border:1px solid var(--line);
  border-radius:6px;background:#fff;cursor:pointer}
input[type=range]{flex:1;max-width:130px;accent-color:var(--brand2)}
label.chk{display:flex;align-items:center;gap:7px;margin-bottom:4px;font-size:12.5px;
  color:#555;cursor:pointer;user-select:none;min-height:22px}
label.chk input{width:15px;height:15px;accent-color:var(--brand2);cursor:pointer}
.btn{padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:#fff;
  cursor:pointer;font-size:12.5px;font-family:inherit;color:var(--text)}
.btn:hover{border-color:var(--brand2);color:var(--brand2)}
.btn.primary{background:linear-gradient(135deg,#a52a2a,#c0392b);color:#fff;border:0;font-weight:600}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.block{width:100%;padding:10px;font-size:14px}
.btn.tiny{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}

#gate{position:fixed;inset:0;background:var(--bg);z-index:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#gate.hide{display:none}
#gate h1{margin:0;font-size:26px;color:var(--brand);font-weight:700;letter-spacing:2px}
#gate .sub{color:var(--sub);font-size:14px;margin-top:-18px}
.gate-btns{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.gate-btns button{width:180px;height:140px;border-radius:16px;border:2px solid var(--line);
  background:#fff;cursor:pointer;font-family:inherit;font-size:20px;color:var(--text);
  font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;transition:.2s;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.gate-btns button:hover{border-color:var(--brand2);color:var(--brand2);
  transform:translateY(-3px);box-shadow:0 8px 20px rgba(140,28,28,.15)}
.gate-btns button .icon{font-size:44px;line-height:1}

.front-grid{display:grid;grid-template-columns:3fr 7fr;gap:9px;align-items:start}
@media(max-width:900px){ .front-grid{ grid-template-columns:1fr; } }
.right-top{display:grid;grid-template-columns:4fr 4fr 2fr;gap:9px;align-items:start}
@media(max-width:1100px){ .right-top{ grid-template-columns:1fr 1fr; } }
@media(max-width:700px){ .right-top{ grid-template-columns:1fr; } }

#pickedList, #libList, .cat-tabs,
#view-front .card h3, #view-front label.fld, #view-front label.chk,
#view-front .btn, #view-front .search-row input{ font-size:19px; }
#view-front .card h3{ font-size:20px; }
#view-front label.fld input, #view-front label.fld select{ font-size:19px; height:36px; padding:6px 10px; }
#view-front .btn{ padding:9px 16px; font-size:19px; }
#view-front .btn.tiny{ font-size:15px; padding:5px 11px; }
#view-front .search-row input{ padding:10px 13px; height:40px; }

.cat-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.cat-tabs button{font-size:19px;padding:6px 16px;border-radius:999px;
  border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;color:#555}
.cat-tabs button:hover{border-color:var(--brand2);color:var(--brand2)}
.cat-tabs button.active{background:linear-gradient(135deg,#a52a2a,#c0392b);
  color:#fff;border:0;font-weight:600}

.dish-lib{display:grid;grid-template-columns:repeat(4, 1fr);gap:7px}
@media(max-width:1100px){ .dish-lib{grid-template-columns:repeat(3,1fr);} }
@media(max-width:700px){ .dish-lib{grid-template-columns:repeat(2,1fr);} }
.lib-item{display:flex;justify-content:space-between;align-items:center;gap:6px;
  border:1px solid var(--line);cursor:pointer;background:#fff;user-select:none;
  overflow:hidden;font-size:22px;padding:10px 12px;border-radius:8px}
.lib-item:hover{border-color:var(--brand2);background:#fff7f5}
.lib-item:active{transform:scale(.97)}
.lib-item .p{color:var(--brand2);font-weight:600;white-space:nowrap;font-size:20px}
.lib-item > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.search-row{display:flex;gap:8px;margin-top:9px}
.search-row input{flex:1;border:1px solid var(--line);font-family:inherit;border-radius:9px}

.picked-list{display:flex;flex-direction:column;max-height:calc(100vh - 220px);overflow:auto}
.picked-item{display:flex;align-items:center;border-bottom:1px dashed var(--line);
  cursor:grab;font-size:22px;padding:10px 4px;gap:8px}
.picked-item:last-child{border-bottom:0}
.picked-item.dragging{opacity:.35}
.picked-item.over{box-shadow:inset 0 3px 0 var(--brand2)}
.grip{color:#c9ccd3;font-size:20px}
.pi-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:22px}
.pi-cat{color:var(--sub);font-size:15px;margin-left:6px}
.pi-dots{display:flex;gap:4px;flex:0 0 auto;align-items:center}
.pi-dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;background:transparent;
  transition:.15s;flex:0 0 auto}
.pi-dot:hover{transform:scale(1.15)}
.pi-dot.active{box-shadow:0 0 0 2px var(--brand2),0 0 0 3px #fff}
.qty{display:flex;align-items:center;gap:3px}
.qty button{width:34px;height:34px;font-size:21px;border-radius:6px;
  border:1px solid var(--line);background:#fff;cursor:pointer;color:#555;padding:0;line-height:1}
.qty button:hover{border-color:var(--brand2);color:var(--brand2)}
.qty-input{width:56px;height:34px;font-size:22px;text-align:center;
  border:1px solid var(--line);border-radius:6px;background:#fafbfc;
  font-family:inherit;color:var(--text);padding:0 4px}
.qty-input:focus{outline:2px solid rgba(140,28,28,.18);border-color:var(--brand2)}
.pi-price{color:var(--brand2);font-weight:600;text-align:right;font-size:22px;min-width:70px}
.del{border:0;background:transparent;color:#c9ccd3;cursor:pointer;font-size:20px;padding:3px 8px}
.del:hover{color:#e74c3c}
.empty{color:var(--sub);text-align:center;padding:14px 0;font-size:19px}

.stat-card{display:flex;justify-content:space-between;text-align:center;padding:6px 0 0;
  border-top:1px solid var(--line);margin-top:8px}
.stat{flex:1;min-width:0;padding:0 3px;border-right:1px dashed var(--line)}
.stat:last-child{border-right:0}
.stat span{display:block;color:var(--sub);margin-bottom:2px;font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{color:var(--brand2);white-space:nowrap;font-size:19px}

.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start}
.admin-grid .card.full{ grid-column:1 / -1; margin-bottom:0; }
.admin-grid .card{ margin-bottom:0; }
@media(max-width:900px){
  .admin-grid{ grid-template-columns:1fr; }
  .admin-grid .card.full{ grid-column:auto; }
}
.two-col{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:0}
@media(max-width:700px){ .two-col{ grid-template-columns:1fr; } }

details.card-fold{background:var(--card);border-radius:var(--radius);padding:10px 13px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:0}
details.card-fold > summary{cursor:pointer;font-size:12.5px;color:var(--brand);
  font-weight:700;list-style:none;padding:2px 0;display:flex;align-items:center;
  gap:6px;user-select:none}
details.card-fold > summary::before{content:'▸';font-size:11px;color:var(--sub)}
details.card-fold[open] > summary::before{content:'▾'}
details.card-fold > summary::-webkit-details-marker{display:none}
details.card-fold .fold-body{margin-top:8px}

details.advanced{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
details.advanced > summary{cursor:pointer;font-size:11.5px;color:var(--sub);
  list-style:none;padding:2px 0}
details.advanced > summary::before{content:'▸ ';}
details.advanced[open] > summary::before{content:'▾ ';}
details.advanced .two-col{margin-top:6px}

.admin-dish-grid{display:grid;grid-template-columns:repeat(8, minmax(0, 1fr));
  gap:6px;margin-top:6px}
@media(max-width:1400px){ .admin-dish-grid{grid-template-columns:repeat(6,minmax(0,1fr));} }
@media(max-width:1100px){ .admin-dish-grid{grid-template-columns:repeat(4,minmax(0,1fr));} }
@media(max-width:750px){ .admin-dish-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
.admin-dish-card{border:1px solid var(--line);border-radius:8px;padding:6px 8px;
  background:#fff;display:flex;flex-direction:column;gap:6px;transition:.15s;position:relative}
.admin-dish-card:hover{border-color:var(--brand2);background:#fff7f5}
.admin-dish-card.selecting{cursor:pointer}
.admin-dish-card.selected{border-color:var(--brand2);background:#fff0eb;
  box-shadow:0 0 0 2px rgba(192,57,43,.15)}
.admin-dish-card .row1{display:flex;align-items:center;gap:6px}
.admin-dish-card .row1 input.nm{flex:1;min-width:0;width:100%;padding:5px 8px;
  border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;
  font-weight:600;text-align:center}
.admin-dish-card .row2{display:flex;align-items:center;gap:6px}
.admin-dish-card .row2 input.pr{flex:1;min-width:0;width:100%;padding:4px 8px;
  border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:inherit;
  text-align:right;color:var(--brand2);font-weight:600}
.admin-dish-card .row2 select.cat{flex:1;min-width:0;width:100%;padding:4px 8px;
  border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:inherit}
.admin-dish-card .chk{width:20px;height:20px;flex:0 0 auto;cursor:pointer;
  accent-color:var(--brand2);display:none}
.admin-dish-card.selecting .chk{display:block}
.admin-dish-card.selecting input,
.admin-dish-card.selecting select{pointer-events:none;opacity:.75}

.cat-filter{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}
.cat-filter button{padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-size:12.5px;font-family:inherit;color:#555}
.cat-filter button:hover{border-color:var(--brand2);color:var(--brand2)}
.cat-filter button.active{background:linear-gradient(135deg,#a52a2a,#c0392b);
  color:#fff;border:0;font-weight:600}

.bulk-bar{display:none;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 10px;background:#fff7e6;border:1px solid #ffd76a;
  border-radius:8px;margin-top:8px}
.bulk-bar.show{display:flex}

.dish-add{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.dish-add input,.dish-add select{padding:6px 9px;border:1px solid var(--line);
  border-radius:7px;font-size:12.5px;font-family:inherit;height:28px}
.dish-add input:first-child{flex:1;min-width:120px}
textarea{width:100%;padding:7px;border:1px solid var(--line);border-radius:7px;
  font-family:inherit;font-size:12.5px;resize:vertical;margin:5px 0}
details:not(.card-fold):not(.advanced) summary{cursor:pointer;font-size:12.5px;
  color:var(--sub);margin-bottom:4px}
.row-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.swatches{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.swatches button{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);
  cursor:pointer;padding:0}
.preview-bar{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.hint{color:var(--sub);font-size:11.5px}

.saved-list{display:flex;flex-direction:column;gap:6px;margin-top:9px;
  max-height:260px;overflow:auto}
.saved-row{display:flex;align-items:center;gap:7px;padding:8px 9px;
  border:1px solid var(--line);border-radius:7px;font-size:18px}
.saved-row .sname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-row .btn.tiny{padding:5px 11px;font-size:15px}
.saved-row .btn.tiny.del{font-size:17px;padding:4px 8px}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;
  display:none;align-items:center;justify-content:center}
.mask.show{display:flex}
.mask .box{background:#fff;border-radius:12px;padding:22px 24px;width:340px;
  max-width:90vw;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mask .box h3{margin:0 0 14px;font-size:16px;color:var(--brand);font-weight:700}
.mask .box input,.mask .box select{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;font-size:15px;font-family:inherit;margin-bottom:14px}
.mask .box input:focus,.mask .box select:focus{
  outline:2px solid rgba(140,28,28,.18);border-color:var(--brand2)}
.mask .box .row-btns{margin-top:0;justify-content:flex-end}
.mask .box .btn{padding:8px 18px;font-size:14px}

.preview-banner{background:#fff7e6;border:1px solid #ffd76a;border-radius:8px;
  padding:8px 12px;margin-bottom:9px;display:flex;align-items:center;gap:10px;
  font-size:13px;color:#8a6d00}
.preview-banner .btn{margin-left:auto}

#paperStage{position:relative;width:100%;overflow:hidden}
#paperScaler{position:absolute;top:0;left:0;transform-origin:top left}
#paper{width:297mm;height:210mm;background:#fff;position:relative;overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.16);border-radius:2px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-overlay{position:absolute;inset:0;z-index:1;pointer-events:none}
.p-content{position:absolute;inset:0;z-index:2}
.p-info{position:absolute;display:flex;flex-direction:column;align-items:center;
  gap:0;flex-wrap:nowrap}
.p-info .seg-v{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.p-info .seg-v > div{line-height:1;white-space:pre}
.p-cols{position:absolute;left:0;right:0;display:flex;flex-direction:row-reverse;
  align-items:flex-start}
.p-col{display:flex;flex-direction:row-reverse;align-items:flex-start;flex:0 0 auto}
.p-col > .cat{display:flex;flex-direction:column;align-items:center;
  flex:0 0 auto;white-space:nowrap}
.p-col > .cat > div{line-height:1;white-space:pre}
.p-col > .dishes{display:flex;flex-direction:row-reverse;
  align-items:flex-start;gap:0;flex:0 0 auto}
.p-col > .dishes > .p-col-sub{display:flex;flex-direction:column;
  gap:0;flex:0 0 auto;position:relative}
.p-col .dish{display:flex;flex-direction:column;align-items:center;
  flex:0 0 auto;white-space:nowrap;position:relative}
.p-col .dish > div{line-height:1;white-space:pre}

@media print{
  @page{size:A4 landscape;margin:0}
  html,body{margin:0!important;padding:0!important;background:#fff!important}
  .topbar,.preview-bar,.hint,.mask,#gate,.preview-banner{display:none!important}
  main{padding:0!important;max-width:none!important}
  .view{display:none!important}
  #view-preview{display:block!important}
  #paperStage{position:static!important;height:auto!important;
    overflow:visible!important;padding:0!important}
  #paperScaler{position:static!important;transform:none!important;
    width:auto!important;height:auto!important}
  #paper{box-shadow:none!important;border-radius:0!important;margin:0!important}
}
</style>
</head>
<body>

<div id="gate">
  <h1>🍽 宴席排菜单</h1>
  <div class="sub">请选择进入方式</div>
  <div class="gate-btns">
    <button id="gateFront"><span class="icon">📋</span><span>前台 · 点菜</span></button>
    <button id="gateAdmin"><span class="icon">⚙️</span><span>后台 · 设置</span></button>
  </div>
</div>

<div class="topbar">
  <div class="brand">🍽 宴席排菜单</div>
  <nav class="tabs">
    <button data-view="front" class="active">前台 · 点菜</button>
    <button data-view="admin">后台 · 设置</button>
    <button data-view="preview">预览 · 打印</button>
    <button id="btnCheckUpdate" title="检查更新">🔄</button>
    <button id="btnExit" title="退出到选择页">⏻ 退出</button>
    <span class="save-hint" id="saveHint">已自动保存</span>
  </nav>
</div>

<main>
  <section id="view-front" class="view">
    <div class="front-grid">
      <div class="card" style="margin-bottom:0">
        <h3>已选菜品</h3>
        <div id="pickedList" class="picked-list"></div>
        <div class="empty" id="pickedEmpty">还没有选菜</div>
        <div class="row-btns" style="margin-top:10px">
          <button class="btn" id="btnUndo" disabled>↩ 撤销</button>
          <button class="btn" id="btnClearPicked">清空已选</button>
        </div>
        <div class="row-btns" style="margin-top:6px">
          <span class="hint" style="align-self:center;margin-right:4px">全部颜色：</span>
          <button class="btn tiny" id="btnAllRed" style="color:#e60012;border-color:#e60012">● 红</button>
          <button class="btn tiny" id="btnAllBlack" style="color:#2b2b2b">● 黑</button>
          <button class="btn tiny" id="btnAllGold" style="color:#e6b422;border-color:#e6b422">● 金</button>
        </div>
        <button class="btn primary block" id="goPreview" style="margin-top:10px">生成排菜单 →</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:9px">
        <div class="right-top">
          <div class="card" style="margin-bottom:0">
            <h3>菜单信息</h3>
            <label class="fld"><span>日期</span><input type="date" id="fDate"></label>
            <label class="fld"><span>餐别</span>
              <select id="fMeal">
                <option value="早餐">早餐</option><option value="午餐">午餐</option>
                <option value="晚餐">晚餐</option><option value="午市">午市</option>
                <option value="晚市">晚市</option><option value="午宴">午宴</option>
                <option value="晚宴" selected>晚宴</option><option value="其他">其他…</option>

function load(){
  try{
    let raw = localStorage.getItem(LS_KEY);
    if(!raw){
      for(const k of LS_LEGACY_KEYS){
        const legacy = localStorage.getItem(k);
        if(legacy){ raw = legacy; try{ localStorage.setItem(LS_KEY, legacy); }catch(e){} break; }
      }
    }
    if(!raw) return clone(DEFAULTS);
    const o = JSON.parse(raw), b = clone(DEFAULTS);
    return {
      bg:     Object.assign(b.bg,     o.bg     || {}),
      layout: Object.assign(b.layout, o.layout || {}),
      dishes: Array.isArray(o.dishes) ? o.dishes.map(d => ({
        id: d.id || uid(), name: d.name || '', price: +d.price || 0,
        cat: CATS.includes(d.cat) ? d.cat : '热菜', hits: +d.hits || 0
      })) : b.dishes,
      front:  Object.assign(b.front,  o.front  || {})
    };
  }catch(e){ return clone(DEFAULTS); }
}

function toast(msg, duration){

    'background:rgba(0,0,0,.82)','color:#fff','padding:14px 22px',

function askPassword(title){
  return new Promise(resolve => {
    showMask(
      '<h3>' + esc(title) + '</h3>' +
      '<input type="password" id="__pwd" placeholder="密码" autocomplete="current-password">' +
      '<div class="row-btns">' +
      '<button class="btn" id="__cancel">取消</button>' +
      '<button class="btn primary" id="__ok">确定</button></div>'
    );
    const input = $('#__pwd');
    setTimeout(() => input.focus(), 50);
    function done(v){ hideMask(); resolve(v); }
    $('#__ok').onclick = () => done(input.value);
    $('#__cancel').onclick = () => done(null);
    input.onkeydown = e => {
      if(e.key === 'Enter') done(input.value);
      if(e.key === 'Escape') done(null);
    };
  });
}
function askSelect(title, options){

    const opts = options.map(o =>
      '<option value="' + esc(o.value) + '">' + esc(o.label) + '</option>').join('');
    showMask(
      '<h3>' + esc(title) + '</h3>' +

      '<div class="row-btns">' +
      '<button class="btn" id="__cancel">取消</button>' +
      '<button class="btn primary" id="__ok">确定</button></div>'

async function sbFetch(path, options){
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const headers = {
    'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json', ...(options && options.headers || {})
  };
  const res = await fetch(url, { ...(options || {}), headers });
  const txt = await res.text();
  if(!res.ok) throw new Error('云端请求失败 (' + res.status + ')：' + txt);
  if(!txt) return null;
  try{ return JSON.parse(txt); }catch(e){ return null; }
}
function getLocalVersion(){ return parseInt(localStorage.getItem(LS_LOCAL_VER) || '0', 10) || 0; }
function setLocalVersion(v){ localStorage.setItem(LS_LOCAL_VER, String(v)); }
async function fetchCloudVersion(){
  const rows = await sbFetch(SUPABASE_TABLE + '?select=version,updated_at,data&id=eq.1', { method:'GET' });
  return (rows && rows[0]) ? rows[0] : null;
}
async function uploadToCloud(){
  let cloud;
  try{ cloud = await fetchCloudVersion(); }
  catch(err){ alert('无法连接云端：' + err.message); return; }
  const payload = { dishes:S.dishes, layout:S.layout, bg:S.bg, _uploadedAt: Date.now() };
  const newVersion = ((cloud && cloud.version) || 0) + 1;
  const record = { id:1, version:newVersion, updated_at:new Date().toISOString(), data:payload };
  try{
    await sbFetch(SUPABASE_TABLE, {
      method:'POST',
      headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(record)
    });
    setLocalVersion(newVersion);
    updateCloudStatus();
    toast('✅ 上传成功！\n云端版本：v' + newVersion);
  }catch(err){ alert('上传失败：' + err.message); }
}
async function pullFromCloud(interactive){
  let cloud;
  try{ cloud = await fetchCloudVersion(); }
  catch(err){ if(interactive) alert('无法连接云端：' + err.message); return; }
  if(!cloud){ if(interactive) alert('云端还没有数据，请先由管理员上传。'); return; }
  if(interactive){
    const cd = cloud.data || {};
    const sameDishes = fastHash(cd.dishes) === fastHash(S.dishes);
    const sameLayout = fastHash(cd.layout) === fastHash(S.layout);
    const sameBg     = fastHash(cd.bg)     === fastHash(S.bg);
    if(sameDishes && sameLayout && sameBg){
      alert('本地和云端数据一致，无需更新。'); return;
    }
    if(!confirm('发现云端数据和本地不一致，是否用云端覆盖本地？\n\n' +
      '云端版本：v' + cloud.version + '\n会覆盖本地的菜品库、排版、背景。\n' +
      '（不影响已选菜品）')) return;
  }
  const d = cloud.data || {};
  if(Array.isArray(d.dishes)){
    S.dishes = d.dishes.map(x => ({
      id: x.id || uid(), name: x.name || '', price: +x.price || 0,
      cat: CATS.includes(x.cat) ? x.cat : '热菜', hits: +x.hits || 0
    }));
  }
  if(d.layout) S.layout = Object.assign(clone(DEFAULTS.layout), d.layout);
  if(d.bg)     S.bg     = Object.assign(clone(DEFAULTS.bg),     d.bg);
  setLocalVersion(cloud.version);
  applyUiFont(); save();
  syncAdminInputs(); renderAdminDishes(); renderFront(); renderPaperSoon();
  updateCloudStatus();
  if(interactive) toast('✅ 已更新到 v' + cloud.version);
}
async function updateCloudStatus(){
  const el = $('#cloudStatus');
  if(!el) return;
  try{
    const cloud = await fetchCloudVersion();
    if(!cloud){ el.textContent = '云端：暂无数据'; el.style.color = ''; }
    else{
      const lv = getLocalVersion(), cv = cloud.version;
      if(cv > lv){ el.textContent = '云端：v' + cv + '（本地 v' + lv + '，有新版）'; el.style.color = '#e67e22'; }
      else{ el.textContent = '云端：v' + cv + '（已是最新）'; el.style.color = '#4caf50'; }
    }
  }catch(e){ el.textContent = '云端：连接失败'; el.style.color = '#e74c3c'; }
}

function fitPaper(){
  const stage = $('#paperStage'), scaler = $('#paperScaler'), paper = $('#paper');
  if(!stage || !paper) return;
  const pw = paper.offsetWidth, ph = paper.offsetHeight;
  if(!pw) return;
  const avail = stage.clientWidth || pw;
  const scale = Math.min(1, avail / pw);
  scaler.style.width = pw + 'px';
  scaler.style.height = ph + 'px';
  scaler.style.transformOrigin = 'top left';
  const left = Math.max(0, (avail - pw * scale) / 2);
  scaler.style.transform = 'translateX(' + left + 'px) scale(' + scale + ')';
  stage.style.height = (ph * scale + 12) + 'px';
}

function makeVBlock(chars, font, size, color, bold, spacing, marginTopMM){
  const box = document.createElement('div');
  box.style.display = 'flex';
  box.style.flexDirection = 'column';
  box.style.alignItems = 'center';
  box.style.fontFamily = font;
  box.style.fontSize = size + 'pt';
  box.style.color = color;
  box.style.fontWeight = bold ? '700' : '400';
  if(marginTopMM) box.style.marginTop = marginTopMM + 'mm';
  chars.forEach((ch, i) => {
    const c = document.createElement('div');
    c.textContent = ch;
    c.style.lineHeight = '1';
    c.style.whiteSpace = 'pre';
    if(i < chars.length - 1 && spacing > 0){
      c.style.marginBottom = (spacing * size * PT2MM) + 'mm';
    }
    box.appendChild(c);
  });
  return box;
}

function dishParts(d, L, peopleNum, isCold){
  const qty = +d.qty || 1;
  const price = +d.price || 0;
  const showQty = L.showQty && qty !== 1;
  const showPrice = L.showPrice && price > 0;
  let qtyText = null, gapRatio = 0;
  if(showQty){
    qtyText = (peopleNum > 1 && qty === peopleNum) ? '位' : String(qty);
    if(qtyText === '位'){
      gapRatio = isCold
        ? (L.coldWeiGap != null ? L.coldWeiGap : 1.5)
        : (L.hotWeiGap != null ? L.hotWeiGap : 8);
    }else{
      gapRatio = isCold
        ? (L.coldQtyGap != null ? L.coldQtyGap : 1.5)
        : (L.hotQtyGap != null ? L.hotQtyGap : 8);
    }
  }
  return { name: d.name, qtyText, showQty, showPrice, price, gapRatio };
}
function dishShowsWei(d, L, peopleNum){
  const qty = +d.qty || 1;
  return !!(L.showQty && qty !== 1 && peopleNum > 1 && qty === peopleNum);
}
function dishCharCount(d, L, peopleNum, isCold){
  const p = dishParts(d, L, peopleNum, isCold);
  let n = (p.name.length || 1);
  if(p.showQty){
    n += p.gapRatio;
    if(p.qtyText !== '位') n += String(p.qtyText).length;
  }
  if(p.showPrice){
    if(p.showQty) n += 1;
    n += String(fmt(p.price)).length + (L.showUnit ? 1 : 0);
  }
  return n;
}
function pickNameColor(d, L, globalColor){ return d.color || globalColor || L.nameColor; }
function pickMetaColor(d, L, globalColor){ return d.color || globalColor || L.priceColor; }

function makeDishEl(d, L, fitSize, peopleNum, isCold, globalColor){
  const p = dishParts(d, L, peopleNum, isCold);
  const row = document.createElement('div');
  row.className = 'dish';
  const nameColor = pickNameColor(d, L, globalColor);
  const metaColor = pickMetaColor(d, L, globalColor);
  row.appendChild(makeVBlock(
    String(p.name).split(''), L.nameFont, fitSize, nameColor, L.boldName, L.nameSpacing, 0));
  if(p.showQty){
    const qtySize = (L.qtySize != null ? L.qtySize : fitSize);
    const gapMM = p.gapRatio * fitSize * PT2MM;
    row.appendChild(makeVBlock(
      String(p.qtyText).split(''), L.nameFont, qtySize, metaColor, false, L.nameSpacing, gapMM));
  }
  if(p.showPrice){
    const priceSize = (L.priceSize != null ? L.priceSize : fitSize);
    if(p.showQty){
      row.appendChild(makeVBlock(['*'], L.nameFont, priceSize, metaColor, false, 0, 0));
    }
    const priceTxt = (L.showUnit ? '¥' : '') + fmt(p.price);
    row.appendChild(makeVBlock(
      String(priceTxt).split(''), L.nameFont, priceSize, metaColor, false, L.nameSpacing, 0));
  }
  return row;
}
function makeAlignedDishEl(d, L, fitSize, peopleNum, isCold, alignLineRatio, globalColor){
  const p = dishParts(d, L, peopleNum, isCold);
  const row = document.createElement('div');
  row.className = 'dish';
  const nameColor = pickNameColor(d, L, globalColor);
  const metaColor = pickMetaColor(d, L, globalColor);
  row.appendChild(makeVBlock(
    String(p.name).split(''), L.nameFont, fitSize, nameColor, L.boldName, L.nameSpacing, 0));
  if(p.showQty && p.qtyText === '位'){
    const spacingF = 1 + (L.nameSpacing || 0);
    const nameChars = p.name.length;
    const gapChars = Math.max(0, alignLineRatio - nameChars);
    const gapMM = gapChars * fitSize * PT2MM * spacingF;
    row.appendChild(makeVBlock(['位'], L.nameFont, fitSize, metaColor, false, L.nameSpacing, gapMM));
    if(p.showPrice){
      const priceSize = (L.priceSize != null ? L.priceSize : fitSize);
      row.appendChild(makeVBlock(['*'], L.nameFont, priceSize, metaColor, false, 0, 0));
      const priceTxt = (L.showUnit ? '¥' : '') + fmt(p.price);
      row.appendChild(makeVBlock(
        String(priceTxt).split(''), L.nameFont, priceSize, metaColor, false, L.nameSpacing, 0));
    }
  }else{
    return makeDishEl(d, L, fitSize, peopleNum, isCold, globalColor);
  }
  return row;
}

let _paperRaf = 0;

function renderPaper(){
  const L = S.layout, B = S.bg;
  const F = _previewOverride ? _previewOverride.front : S.front;
  const paper = $('#paper');
  if(!paper) return;
  const colorOverride = F.colorOverride || '';

  if(B.type === 'image' && B.image){
    paper.style.backgroundColor = B.color || '#fff';
    paper.style.backgroundImage = 'url("' + B.image + '")';
    paper.style.backgroundSize = B.fit || 'cover';
    paper.style.backgroundPosition = 'center center';
    paper.style.backgroundRepeat = 'no-repeat';
  }else{
    paper.style.backgroundColor = B.color || '#fff';
    paper.style.backgroundImage = 'none';
  }
  paper.querySelector('.p-overlay').style.background =
    'rgba(255,255,255,' + ((B.overlay || 0) / 100) + ')';

  const groups = {};
  CATS_PRINT.forEach(c => groups[c] = []);
  F.picked.forEach(d => {
    const rawCat = CATS.includes(d.cat) ? d.cat : '热菜';
    const c = printCatOf(rawCat);
    if(!groups[c]) groups[c] = [];
    groups[c].push(d);
  });

  const peopleNum = parseInt(F.people, 10) || 0;

  let alignBaseChars = 0;
  CATS_PRINT.forEach(cat => {
    const list = groups[cat];
    if(!list.length) return;
    const isCold = (cat === '冷菜');
    const isCold2 = (isCold && list.length >= (L.splitAt || 6));
    if(isCold2) return;
    list.forEach(d => {
      if(!dishShowsWei(d, L, peopleNum)) return;
      const nameLen = Math.min(d.name.length, 6);
      if(nameLen > alignBaseChars) alignBaseChars = nameLen;
    });
  });
  const hotWeiGapVal = (L.hotWeiGap != null ? L.hotWeiGap : 8);
  const alignLineRatio = alignBaseChars + hotWeiGapVal;

  /* 信息栏 */
  const info = paper.querySelector('.p-info');
  info.innerHTML = '';
  info.style.display = L.showInfo ? 'flex' : 'none';
  info.style.right = L.infoRight + 'mm';
  info.style.top = 'auto';
  info.style.bottom = (L.infoBottom != null ? L.infoBottom : 30) + 'mm';
  info.style.flexDirection = 'column';
  info.style.alignItems = 'center';
  info.style.gap = L.infoGap + 'mm';
  info.style.flexWrap = 'nowrap';
  info.style.border = 'none';
  info.style.padding = '0';
  if(L.showInfo){
    if(L.infoBox){
      info.style.border = '0.4mm solid ' + (colorOverride || L.infoColor);
      info.style.padding = L.infoBoxPad + 'mm';
    }
    const meal = F.meal === '其他' ? (F.mealOther || '') : (F.meal || '');
    const people = F.people ? F.people + '位' : '';
    [
      { txt: dateCN(F.date), spacing: L.dateSpacing },
      { txt: meal,           spacing: L.infoSpacing },
      { txt: F.guest || '',  spacing: L.infoSpacing },
      { txt: people,         spacing: L.infoSpacing },
      { txt: F.chef || '',   spacing: L.infoSpacing }
    ].forEach(seg => {
      if(!seg.txt) return;
      const el = makeVBlock(
        String(seg.txt).split(''), L.infoFont, L.infoSize,
        colorOverride || L.infoColor,
        L.boldInfo, seg.spacing, 0);
      el.classList.add('seg-v');
      info.appendChild(el);
    });
  }

  /* 类目列 */
  const cols = paper.querySelector('.p-cols');
  cols.innerHTML = '';
  cols.style.top = (L.catTop * 10) + 'mm';
  cols.style.gap = L.colGap + 'mm';

  let infoWidthMM = 0;
  if(L.showInfo && info.offsetWidth) infoWidthMM = info.offsetWidth * 25.4 / 96;
  cols.style.paddingRight = (L.infoRight + infoWidthMM + L.infoToFirst * 10) + 'mm';

  const availMM = 210 - L.catTop * 10 - L.catSize * PT2MM * 1.6
    - L.catGap - (L.pagePadBottom || 8);
  const allowNeg = !!L.allowOverlap;

  CATS_PRINT.forEach(cat => {
    const list = groups[cat];
    if(!list.length) return;
    const isCold = (cat === '冷菜');
    const isCold2 = (isCold && list.length >= (L.splitAt || 6));

    const col = document.createElement('div');
    col.className = 'p-col';

    let subColumns = [];
    if(isCold2){
      const byLen = list.slice().sort((a, b) =>
        (a.name.length - b.name.length) || a.name.localeCompare(b.name, 'zh'));
      const topCount = Math.ceil(byLen.length / 2);
      const top = byLen.slice(0, topCount);
      const bottom = byLen.slice(topCount);
      for(let i = 0; i < topCount; i++){
        const pair = [top[i]];
        if(bottom[i]) pair.push(bottom[i]);
        subColumns.push(pair);
      }
    }else{
      list.forEach(d => subColumns.push([d]));
    }

    let fitSize = L.nameSize;
    if(L.autoFit !== false){
      const spacingF = 1 + (L.nameSpacing || 0);
      const innerGap = n => {
        if(n <= 1) return 0;
        let g = L.rowGap != null ? L.rowGap : 2;
        if(!allowNeg) g = Math.max(0, g);
        return g * (n - 1);
      };
      const need = sz => {
        let m = 0;
        subColumns.forEach(pair => {
          const chars = pair.reduce((s, d) =>
            s + dishCharCount(d, L, peopleNum, isCold), 0);
          const v = chars * sz * PT2MM * spacingF + innerGap(pair.length);
          if(v > m) m = v;
        });
        return m;
      };
      if(need(L.nameSize) > availMM){
        let sz = L.nameSize, guard = 0;
        while(need(sz) > availMM && sz > 4 && guard++ < 500){
          sz = Math.max(4, +(sz - 0.5).toFixed(1));
        }
        fitSize = sz;
      }
    }

    const dishesWrap = document.createElement('div');
    dishesWrap.className = 'dishes';
    let cg = L.colGap != null ? L.colGap : 6;
    if(!allowNeg) cg = Math.max(0, cg);
    dishesWrap.style.gap = cg + 'mm';

    let coldTopMaxChars = 0, coldPairGapMM = 0;
    if(isCold2){
      subColumns.forEach(pair => {
        if(pair.length >= 1){
          const c = dishCharCount(pair[0], L, peopleNum, isCold);
          if(c > coldTopMaxChars) coldTopMaxChars = c;
        }
      });
      const ratio = L.coldPairGap != null ? L.coldPairGap : 2;
      coldPairGapMM = ratio * fitSize * PT2MM;
    }

    const colAlign = !isCold2;

    subColumns.forEach(pair => {
      const sub = document.createElement('div');
      sub.className = 'p-col-sub';
      sub.style.display = 'flex';
      sub.style.flexDirection = 'column';
      sub.style.position = 'relative';

      if(isCold2 && pair.length === 2){
        const spacingF = 1 + (L.nameSpacing || 0);
        const topSlotMM = coldTopMaxChars * fitSize * PT2MM * spacingF;
        const topRow = document.createElement('div');
        topRow.style.height = topSlotMM + 'mm';
        topRow.style.display = 'flex';
        topRow.style.alignItems = 'flex-start';
        topRow.appendChild(makeDishEl(pair[0], L, fitSize, peopleNum, isCold, colorOverride));
        sub.appendChild(topRow);
        const bottomEl = makeDishEl(pair[1], L, fitSize, peopleNum, isCold, colorOverride);
        bottomEl.style.marginTop = coldPairGapMM + 'mm';
        sub.appendChild(bottomEl);
      }else{
        pair.forEach(d => {
          const showWei = dishShowsWei(d, L, peopleNum);
          if(colAlign && showWei){
            sub.appendChild(makeAlignedDishEl(d, L, fitSize, peopleNum, isCold, alignLineRatio, colorOverride));
          }else{
            sub.appendChild(makeDishEl(d, L, fitSize, peopleNum, isCold, colorOverride));
          }
        });
      }
      dishesWrap.appendChild(sub);
    });

    const nameEl = makeVBlock(
      String(cat).split(''), L.catFont, L.catSize,
      colorOverride || L.catColor,
      L.boldCat, L.catSpacing, 0);
    nameEl.classList.add('cat');
    nameEl.style.marginLeft = (L.catNameGap != null ? L.catNameGap : 2) + 'mm';
    col.appendChild(nameEl);
    col.appendChild(dishesWrap);
    if(L.nameOffsetTop) dishesWrap.style.marginTop = L.nameOffsetTop + 'mm';
    cols.appendChild(col);
  });
}

function addPick(dish){
  pushUndo();
  if(dish.id){
    const hit = S.dishes.find(x => x.id === dish.id);
    if(hit) hit.hits = (+hit.hits || 0) + 1;
  }
  const ex = S.front.picked.find(p =>
    p.name === dish.name && p.price === dish.price &&
    p.cat === dish.cat && !p.color);
  if(ex) ex.qty += 1;
  else S.front.picked.push({
    name: dish.name, price: dish.price, cat: dish.cat, qty: 1,
    color: S.front.colorOverride || '',
    temp: !!dish.temp
  });

}

  try{ localStorage.setItem(LS_SAVED, JSON.stringify(o)); }

}
async function loadSavedCloud(){
  try{
    const rows = await sbFetch('saved_menus?select=name,front,saved_at');
    const out = {};
    (rows || []).forEach(r => {
      out[r.name] = { front: r.front, savedAt: r.saved_at || 0 };
    });
    return out;
  }catch(e){
    console.warn('云端存档读取失败', e);
    return null;
  }
}
async function loadSavedMenusAll(){
  const local = loadSavedLocal();
  const cloud = await loadSavedCloud();
  if(cloud === null){
    let cache = {};
    try{ cache = JSON.parse(localStorage.getItem(LS_SAVED_CACHE) || '{}'); }
    catch(e){ cache = {}; }
    const merged = Object.assign({}, cache, local);
    merged.__offline = true;
    return merged;
  }
  try{ localStorage.setItem(LS_SAVED_CACHE, JSON.stringify(cloud)); }
  catch(e){ console.warn('存档缓存写入失败', e); }
  const merged = Object.assign({}, local, cloud);
  merged.__offline = false;
  return merged;
}
async function saveOneMenu(name, data){
  const local = loadSavedLocal();
  local[name] = data;
  saveSavedLocal(local);
  try{
    await sbFetch('saved_menus', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ name: name, front: data.front, saved_at: data.savedAt })
    });
    return { ok: true, cloud: true };
  }catch(e){
    console.warn('云端保存失败', e);
    return { ok: true, cloud: false };
  }
}
async function deleteOneMenu(name){
  const local = loadSavedLocal();
  delete local[name];
  saveSavedLocal(local);
  try{
    await sbFetch('saved_menus?name=eq.' + encodeURIComponent(name), { method: 'DELETE' });
    return { ok: true, cloud: true };
  }catch(e){
    console.warn('云端删除失败', e);
    return { ok: true, cloud: false };
  }
}

      for(const k of LS_TPL_LEGACY_KEYS){

        if(legacy){
          try{ localStorage.setItem(LS_TPL, legacy); }catch(e){}

    return JSON.parse(raw || '{}');
  }catch(e){ return {}; }

async function exportPng(returnBlob){
  if(typeof html2canvas === 'undefined'){
    alert('导出 PNG 需要 html2canvas 库，请检查本地文件是否存在。');
    return null;
  }
  if(document.fonts && document.fonts.ready){
    try{ await document.fonts.ready; }catch(e){}
    await new Promise(r => setTimeout(r, 300));
  }
  const paper = $('#paper');
  if(!paper) return null;
  const scaler = $('#paperScaler');
  const oldTransform = scaler.style.transform;
  const oldWidth = scaler.style.width;
  const oldHeight = scaler.style.height;
  scaler.style.transform = 'none';
  scaler.style.width = 'auto';
  scaler.style.height = 'auto';

  try{
    const canvas = await html2canvas(paper, {
      scale: 2, useCORS: true, allowTaint: false,
      backgroundColor: null, logging: false
    });
    scaler.style.transform = oldTransform;
    scaler.style.width = oldWidth;
    scaler.style.height = oldHeight;
    if(returnBlob){
      return await new Promise(res => canvas.toBlob(b => res(b), 'image/png'));
    }
    canvas.toBlob(blob => {
      if(!blob){ alert('导出失败，请重试。'); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '宴席菜单-' + todayStr() + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }, 'image/png');
  }catch(err){
    console.error(err);
    alert('导出失败：' + err.message);
    scaler.style.transform = oldTransform;
    scaler.style.width = oldWidth;
    scaler.style.height = oldHeight;
    return null;
  }
}

    '<input id="__tdName" placeholder="菜名" autocomplete="off">' +
    '<input id="__tdPrice" type="number" placeholder="价格" step="0.01">' +

$('#addDishBtn').addEventListener('click', function(){

function parseBulk(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const p = line.split(/[,，\t|]/).map(s => s.trim());
    const name = p[0] || '';
    const price = parseFloat(p[1]) || 0;
    const cat = CATS.includes(p[2]) ? p[2] : '热菜';
    return name ? { id: uid(), name, price, cat, hits: 0 } : null;
  }).filter(Boolean);
}
$('#bulkReplace').addEventListener('click', () => {
  const list = parseBulk($('#bulkText').value);
  if(!list.length){ alert('没有解析到有效数据'); return; }
  pushUndo(); S.dishes = list;
  save(); renderAdminDishes(); renderFront(); renderPaperSoon();
  toast('已替换为 ' + list.length + ' 个菜品');
});
$('#bulkAppend').addEventListener('click', () => {

/* 已选菜品交互 */
$('#pickedList').addEventListener('click', function(e){
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  if(btn.tagName === 'INPUT') return;
  const row = btn.closest('.picked-item'), i = +row.dataset.i, it = S.front.picked[i];
  if(!it) return;
  const act = btn.dataset.act;
  if(act === 'color'){
    const newColor = btn.dataset.color || '';
    it.color = (newColor === '#2b2b2b') ? '' : newColor;
    save(); renderFront(); renderPaperSoon();
    return;
  }
  if(act === 'inc') it.qty = Math.round((it.qty + 0.5) * 10) / 10;
  else if(act === 'dec'){
    it.qty = Math.round((it.qty - 0.5) * 10) / 10;
    if(it.qty < 0.5) S.front.picked.splice(i, 1);
  }
  else if(act === 'del') S.front.picked.splice(i, 1);
  save(); renderFront(); renderPaperSoon();
});
$('#pickedList').addEventListener('input', function(e){
  const inp = e.target.closest('.qty-input');
  if(!inp) return;
  const row = inp.closest('.picked-item'), i = +row.dataset.i, it = S.front.picked[i];
  if(!it) return;
  const raw = inp.value.trim();
  if(raw === '' || raw === '-' || raw === '.') return;
  const v = parseFloat(raw);
  if(isNaN(v) || v <= 0) return;
  it.qty = Math.round(v * 10) / 10;
  save();
  renderPaperSoon();
  const priceEl = row.querySelector('.pi-price');
  if(priceEl) priceEl.textContent = '¥' + fmt(it.price * it.qty);
});
$('#pickedList').addEventListener('change', function(e){
  const inp = e.target.closest('.qty-input');
  if(!inp) return;
  const row = inp.closest('.picked-item'), i = +row.dataset.i, it = S.front.picked[i];
  if(!it) return;
  let v = parseFloat(inp.value);
  if(isNaN(v) || v < 0.5) S.front.picked.splice(i, 1);
  else it.qty = Math.round(v * 10) / 10;
  save(); renderFront(); renderPaperSoon();
});
let dragIdx = null;
const pickBox = $('#pickedList');
pickBox.addEventListener('dragstart', e => {
  const el = e.target.closest('.picked-item');
  if(!el || e.target.tagName === 'INPUT') return;
  dragIdx = +el.dataset.i;
  el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', String(dragIdx)); }catch(err){}
});
pickBox.addEventListener('dragover', e => {
  e.preventDefault();
  pickBox.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  const el = e.target.closest('.picked-item');
  if(el) el.classList.add('over');
});
pickBox.addEventListener('drop', e => {
  e.preventDefault();
  const el = e.target.closest('.picked-item');
  if(!el || dragIdx === null) return;
  const to = +el.dataset.i;
  const moved = S.front.picked.splice(dragIdx, 1)[0];
  S.front.picked.splice(to, 0, moved);
  dragIdx = null;
  save(); renderFront(); renderPaperSoon();
});
pickBox.addEventListener('dragend', () => {
  dragIdx = null;
  pickBox.querySelectorAll('.dragging,.over').forEach(x =>
    x.classList.remove('dragging','over'));
});

/* 全部颜色 */
function setAllColor(color){
  if(!S.front.picked.length){ toast('还没有选菜'); return; }
  pushUndo();
  S.front.colorOverride = color;
  S.front.picked.forEach(it => { it.color = color; });
  save(); renderFront(); renderPaperSoon();
  updateAllColorButtons();
  const name = color === '#e60012' ? '红' : color === '#e6b422' ? '金' : '默认';
  toast('全部已改为「' + name + '」色');
}
function updateAllColorButtons(){
  const cur = S.front.colorOverride || '';
  const pairs = [
    ['#btnAllRed',   '#e60012'],
    ['#btnAllGold',  '#e6b422'],
    ['#btnAllBlack', '']
  ];
  pairs.forEach(([sel, val]) => {
    const el = $(sel);
    if(el){
      el.style.opacity = (cur === val) ? '1' : '.45';
      el.style.fontWeight = (cur === val) ? '700' : '400';
    }
  });
}
$('#btnAllRed').addEventListener('click', () => setAllColor('#e60012'));
$('#btnAllBlack').addEventListener('click', () => setAllColor(''));
$('#btnAllGold').addEventListener('click', () => setAllColor('#e6b422'));

$('#btnClearPicked').addEventListener('click', () => {
  if(!S.front.picked.length) return;
  if(!confirm('清空已选菜品？')) return;
  pushUndo();
  S.front.picked = [];
  S.front.colorOverride = '';
  save(); renderFront(); renderPaperSoon();
  updateAllColorButtons();
});
$$('[data-bind]').forEach(el => {
  const evt = (el.type === 'checkbox' || el.tagName === 'SELECT' ||
    el.type === 'color') ? 'change' : 'input';
  el.addEventListener(evt, () => {
    const path = el.dataset.bind;
    let v;
    if(el.type === 'checkbox') v = el.checked;
    else if(el.type === 'number' || el.type === 'range') v = parseFloat(el.value) || 0;
    else v = el.value;
    setPath(S, path, v);
    if(path === 'bg.overlay') $('#overlayV').textContent = v + '%';
    if(path === 'layout.uiFont') applyUiFont();
    save(); renderPaperSoon();
  });
});
$('#aBgFile').addEventListener('change', function(e){
  const f = e.target.files[0];
  if(!f) return;
  const img = new Image();
  const r = new FileReader();
  r.onload = () => { img.src = r.result; };
  img.onload = () => {
    const MAX = 1600;
    let w = img.width, h = img.height;
    if(Math.max(w, h) > MAX){
      const k = MAX / Math.max(w, h);
      w = Math.round(w * k); h = Math.round(h * k);
    }
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    S.bg.image = cv.toDataURL('image/jpeg', 0.85);
    S.bg.type = 'image';
    save(); syncAdminInputs(); renderPaperSoon();
  };
  r.readAsDataURL(f);
});
$('#btnClearBg').addEventListener('click', () => {
  S.bg.image = ''; S.bg.type = 'color';
  save(); syncAdminInputs(); renderPaperSoon();
});
$('#exportCfg').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '宴席排菜单-配置-' + todayStr() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
});
$('#importCfg').addEventListener('change', function(e){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result), b = clone(DEFAULTS);
      S = {
        bg:     Object.assign(b.bg,     o.bg     || {}),
        layout: Object.assign(b.layout, o.layout || {}),
        dishes: Array.isArray(o.dishes) ? o.dishes : b.dishes,
        front:  Object.assign(b.front,  o.front  || {})
      };
      applyUiFont();
      save(); syncAdminInputs(); renderAdminDishes(); renderFront();
      renderPaperSoon(); renderTplList();
      updateAllColorButtons();
      toast('导入成功');
    }catch(err){ alert('导入失败：不是有效的配置文件'); }
  };
  r.readAsText(f);
  e.target.value = '';
});
$('#resetCfg').addEventListener('click', () => {
  if(!confirm('恢复默认设置和菜品，当前数据会丢失。确定？')) return;
  pushUndo();
  S = clone(DEFAULTS);
  applyUiFont();
  save(); syncAdminInputs(); renderAdminDishes(); renderFront();
  renderPaperSoon(); renderTplList();
  updateAllColorButtons();
});
$('#btnPrint').addEventListener('click', () => { window.print(); });
$('#btnExportPng').addEventListener('click', async () => {
  const btn = $('#btnExportPng');
  const old = btn.textContent;
  btn.textContent = '⏳ 导出中…';
  btn.disabled = true;
  await exportPng(false);
  btn.textContent = old;
  btn.disabled = false;
});
$('#btnShare').addEventListener('click', async () => {
  const btn = $('#btnShare');
  const old = btn.textContent;
  btn.textContent = '⏳ 生成中…';
  btn.disabled = true;
  const blob = await exportPng(true);
  btn.textContent = old;
  btn.disabled = false;
  if(!blob) return;
  const fileName = '宴席菜单-' + todayStr() + '.png';
  try{
    const file = new File([blob], fileName, { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: '宴席菜单', text: '宴席菜单' });
      return;
    }
  }catch(err){
    if(err && err.name === 'AbortError') return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('图片已下载到本地，请手动发送到微信。');
});

function init(){
  applyUiFont();
  syncAdminInputs();
  renderAdminDishes();
  renderFront();
  renderPaper();
  renderTplList();
  renderSavedList();
  showGate();
  window.addEventListener('resize', () => {
    if($('#view-preview').classList.contains('active')) fitPaper();
  });
  setTimeout(() => {
    autoCheckUpdate();
    updateCloudStatus();
  }, 800);
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}

})();
